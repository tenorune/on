name: Deploy to dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx jest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Write .env.local from secret
        run: |
          printf '%s\n' "${{ secrets.FIREBASE_CONFIG_DEV }}" > .env.local

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Build
        run: node scripts/dev-build.js

      - name: Deploy hosting + database rules
        run: |
          PROJECT_ID=$(grep -E '^FIREBASE_PROJECT_ID=' .env.local | head -1 | cut -d= -f2- | tr -d '\r"' )
          if [ -z "$PROJECT_ID" ]; then
            echo "ERROR: FIREBASE_PROJECT_ID not found in .env.local" >&2
            exit 1
          fi
          npx firebase deploy \
            --only hosting,database \
            --project "$PROJECT_ID" \
            --non-interactive
