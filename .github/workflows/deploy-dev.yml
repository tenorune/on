name: Deploy to dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx jest
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm run test:rules

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write .env.local from secret
        run: |
          printf '%s\n' "${{ secrets.FIREBASE_CONFIG_DEV }}" > .env.local

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Build
        env:
          ABOUT_AUTHOR: ${{ vars.ABOUT_AUTHOR }}
          DATA_REGION: ${{ vars.DATA_REGION }}
          # Optional (empty ⇒ feature inert): scripts/build.js lets these real
          # env vars override the env file, so they live here as Actions
          # variables/secrets instead of inside the write-only config secret.
          TELEGRAM_APP_LINK: ${{ vars.TELEGRAM_APP_LINK_DEV }}
          DEV_RESET_SECRET: ${{ secrets.DEV_RESET_SECRET_DEV }}
          DEV_RESET_HOSTS: ${{ vars.DEV_RESET_HOSTS_DEV }}
        run: node scripts/dev-build.js

      - name: Deploy hosting + database rules
        run: |
          PROJECT_ID=$(grep -E '^FIREBASE_PROJECT_ID=' .env.local | head -1 | cut -d= -f2- | tr -d '\r"' )
          if [ -z "$PROJECT_ID" ]; then
            echo "ERROR: FIREBASE_PROJECT_ID not found in .env.local" >&2
            exit 1
          fi
          npx firebase deploy \
            --only hosting,database,functions \
            --project "$PROJECT_ID" \
            --non-interactive \
            --force
