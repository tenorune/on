<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- CSP: deploy via firebase.json headers, not meta tag (meta blocks 'self' on local dev, ignores frame-ancestors) -->
  <!--
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-8plvDJLmM7886+ra4DrxBzGM2hgpxIJwDEK2Iu4PWMU='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" />
  -->
  <title>Status</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/canvas.css" />
  <script>try{var t=JSON.parse(localStorage.getItem('statusapp_theme')||'null');if(t){var r=document.documentElement;r.style.setProperty('--bg',t.bg);r.style.setProperty('--surface',t.surface);r.style.setProperty('--surface2',t.surface2);r.style.setProperty('--text',t.text);r.style.setProperty('--text-muted',t.textMuted);r.style.setProperty('--accent',t.accent);r.style.setProperty('--error-bg',t.errorBg);r.style.setProperty('--error-text',t.errorText);}}catch(e){}</script>
</head>
<body>

  <div id="splash">k&#x0338;n&#x0336;o&#x0338;c&#x0335;k&#x0335; &#x0336;k&#x0338;n&#x0337;o&#x0335;c&#x0338;k&#x0335;</div>

  <!-- Stale identity recovery screen -->
  <div id="stale-screen" class="stale-screen hidden">
    <div class="stale-card">
      <p class="stale-msg">Your previous session was not found.<br>A new code has been generated for you.</p>
      <button id="stale-continue-btn" class="primary-btn">Continue</button>
    </div>
  </div>

  <header id="app-header">
    <div id="header-row">
      <div id="my-dot" class="dot"></div>
      <div id="header-text">
        <div id="header-status-row">
          <span id="my-status-label" class="status-label">Unavailable</span>
          <span id="time-remaining" style="display:none"></span>
        </div>
        <div id="header-chips">
          <button id="time-chip" class="chip time-chip">2 hours</button>
          <button id="mycode-chip" class="chip">My Code</button>
        </div>
        <div id="swatch-row" style="display:none"></div>
      </div>
    </div>
    <div id="code-drawer">
      <div class="drawer-inner">
        <div class="code-row">
          <span id="my-code-display" class="code-display"></span>
          <button id="rotate-code-btn" class="rotate-btn" title="Generate new code">↻</button>
          <button id="copy-code-btn" class="ghost-btn">Copy</button>
        </div>
        <p id="rotate-error-msg" class="error-msg hidden"></p>
        <p class="hint">Share this so others can follow your status.</p>
      </div>
    </div>
  </header>

  <div id="favorites-strip"></div>

  <div id="canvas-screen">
    <canvas id="draw-canvas"></canvas>
  </div>

  <main id="main-list">
    <div id="offline-banner" class="offline-banner hidden">Offline — showing last known status</div>
    <ul id="people-list" class="person-list"></ul>
    <p id="empty-list-msg" class="hidden"></p>
    <div id="add-person-area">
    <button id="add-person-btn" class="add-btn">Add a person</button>
    <div id="add-person-form">
      <div class="add-form">
        <label class="field-label">Code</label>
        <input id="add-code-input" type="text" maxlength="6" placeholder="e.g. XK7P2M" class="code-input" autocomplete="off" />
        <label class="field-label">Name (optional)</label>
        <input id="add-label-input" type="text" maxlength="40" placeholder="e.g. Partner, Mom" class="text-input" />
        <p id="add-error" class="error-msg hidden"></p>
        <div style="display:flex;gap:8px">
          <button id="add-submit-btn" class="primary-btn">Follow</button>
          <button id="add-cancel-btn" class="ghost-btn">Cancel</button>
        </div>
      </div>
    </div>
    </div>
  </main>

  <script src="dist/bundle.js"></script>
</body>
</html>
